[project]
name = "user-api"
version = "0.1.0"
description = "基于 FastAPI + SQLAlchemy 2.0 + MySQL + Alembic 的用户信息增删改查接口"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # passlib 1.7.4 与 bcrypt>=4.1 不兼容，因此锁定 bcrypt 4.0.x
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    # MySQL 8 默认使用 caching_sha2_password，PyMySQL 需要 cryptography 才能认证
    "cryptography>=42",
    "pydantic-settings>=2.2",
    "pyjwt>=2.14.0",
    "python-multipart==0.0.9",
    "boto3>=1.43.93",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "redis>=5.0",
    # RAG 文件向量化入库（app/rag/core.py）：解析 / 向量化 / 向量库
    "PyPDF2>=3.0",
    "python-docx>=1.1",
    "dashscope>=1.20",
    "qdrant-client>=1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
